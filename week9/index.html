<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>9주차 실습 - 폼 · 콤보박스 · 모달</title>
  <style>
    /* ===== reset ===== */
    *, *::before, *::after { box-sizing: border-box; }
    body, h1, h2, p, ul { margin: 0; padding: 0; }
    ul { list-style: none; }
    button, input { font: inherit; }

    /* ===== 기본 레이아웃 (수정 금지) ===== */
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: #f1f5f9;
      color: #0f172a;
      padding: 48px 16px;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 32px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    h1 { font-size: 24px; margin-bottom: 24px; }
    .field { margin-bottom: 20px; }
    .field label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
    }
    .btn-row { display: flex; gap: 8px; margin-top: 8px; }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: #0f172a;
      font-weight: 700;
      cursor: pointer;
    }
    .link-btn {
      margin-top: 16px;
      border: none;
      background: none;
      color: #64748b;
      text-decoration: underline;
      cursor: pointer;
    }

    /* ===== 여기부터 실습 과제 작성 ===== */

    /* [미션 1] 인풋 상태 스타일 (:focus · :disabled · .error · 오류 문구 표시) */
    input:focus {
      /* 브라우저 기본 outline 대신 테두리+그림자로 포커스를 통일감 있게 표시 */
      outline: none;
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.3);
    }
    input:disabled {
      background: #f1f5f9;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .field.error input {
      border-color: #ef4444;
    }
    .msg {
      /* 오류가 없을 땐 문구가 자리를 차지하지 않도록 숨김 */
      display: none;
      margin-top: 6px;
      font-size: 13px;
      color: #ef4444;
    }
    .field.error .msg {
      display: block;
    }

    /* [미션 2] 버튼 상태 스타일 (:hover · :active · :disabled) */
    /* :not(:disabled) — 비활성 버튼은 마우스를 올리거나 눌러도 반응하지 않게 */
    .btn:hover:not(:disabled) {
      background: #0ea5e9;
    }
    .btn:active:not(:disabled) {
      background: #0284c7;
      transform: translateY(1px);
    }
    .btn:disabled {
      background: #e2e8f0;
      color: #94a3b8;
      cursor: not-allowed;
    }

    /* [미션 3] 콤보박스 구조 · 목록 · 열림 상태 (relative · absolute 겹침 배치 · .open 목록 표시 · 화살표 회전) */
    .combo {
      /* 목록(absolute)의 위치 기준점 */
      position: relative;
    }
    .combo-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: #0f172a;
      cursor: pointer;
    }
    .combo-btn img {
      width: 16px;
      height: 16px;
      transition: transform 0.2s;
    }
    .combo-list {
      display: none;
      /* 아래 버튼들을 밀어내지 않고 그 위에 겹쳐 뜨도록 absolute */
      position: absolute;
      top: 100%;
      left: 0;
      width: 100%;
      margin-top: 4px;
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.12);
      /* 뒤에 오는 가입 버튼보다 위에 보이게 */
      z-index: 10;
      overflow: hidden;
    }
    .combo-list li {
      padding: 12px 16px;
      cursor: pointer;
    }
    .combo-list li:hover {
      background: #f1f5f9;
    }
    .combo.open .combo-list {
      display: block;
    }
    .combo.open .combo-btn img {
      transform: rotate(180deg);
    }

    /* [미션 4] 모달 딤드 · 박스 · 열림 상태 (position: fixed · flex 가운데 정렬 · .open 표시) */
    .modal {
      display: none;
      /* 스크롤과 상관없이 화면 전체를 덮도록 fixed */
      position: fixed;
      inset: 0;
      justify-content: center;
      align-items: center;
      padding: 16px;
      background: rgba(15, 23, 42, 0.6);
      z-index: 100;
    }
    .modal.open {
      display: flex;
    }
    .modal-box {
      /* 닫기 버튼(absolute)의 위치 기준점 */
      position: relative;
      width: 100%;
      max-width: 400px;
      padding: 32px 24px 24px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.2);
    }
    .modal-box h2 {
      margin-bottom: 12px;
      font-size: 20px;
    }
    .modal-box p {
      font-size: 14px;
      line-height: 1.6;
      color: #475569;
    }
    .close {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 4px;
      border: none;
      background: none;
      cursor: pointer;
    }
    .close img {
      display: block;
      width: 20px;
      height: 20px;
    }

  </style>
</head>
<body>
  <div class="container">
    <h1>회원가입</h1>

    <div class="field">
      <label for="name">이름</label>
      <input type="text" id="name" placeholder="이름을 입력하세요">
    </div>

    <!-- [미션 1] 이메일 field 에 error 클래스와 오류 문구(.msg) 추가 -->
    <div class="field error">
      <label for="email">이메일</label>
      <input type="email" id="email" value="abc@jnu">
      <p class="msg">올바른 이메일 형식이 아니에요. (예: abc@jnu.ac.kr)</p>
    </div>

    <!-- [미션 1] 학번 input 에 disabled 속성 추가 -->
    <div class="field">
      <label for="student-id">학번</label>
      <input type="text" id="student-id" value="2026000000" disabled>
    </div>

    <div class="field">
      <label>관심 분야</label>
      <!-- [미션 3] 여기에 div 콤보박스 작성 (.combo > .combo-btn + ul.combo-list) -->
      <!-- 화살표는 arrow.svg 를 img 로 삽입 -->
      <!-- .combo 에 open 클래스를 붙여 열림 상태 확인, 제출 시엔 open 클래스 없는 상태로 제출 -->
      <div class="combo">
        <button type="button" class="combo-btn">
          <span>관심 분야를 선택하세요</span>
          <img src="arrow.svg" alt="">
        </button>
        <ul class="combo-list">
          <li>프론트엔드</li>
          <li>백엔드</li>
          <li>UI/UX 디자인</li>
          <li>데이터 분석</li>
        </ul>
      </div>
    </div>

    <div class="btn-row">
      <button class="btn">가입하기</button>
      <!-- [미션 2] 임시 저장 버튼에 disabled 속성 추가 -->
      <button class="btn" disabled>임시 저장</button>
    </div>

    <button class="link-btn">이용약관 보기</button>
  </div>

  <!-- [미션 4] 여기에 모달 작성 (.modal > .modal-box > button.close + h2 + p) -->
  <!-- 닫기 아이콘은 close.svg 를 button.closed안에 img로 삽입 -->
  <!-- .modal 에 open 클래스를 붙여 열림 상태 확인, 제출 시엔 open 클래스 없는 상태로 제출 -->
  <div class="modal">
    <div class="modal-box">
      <button type="button" class="close"><img src="close.svg" alt="닫기"></button>
      <h2>이용약관</h2>
      <p>회원가입을 진행하면 서비스 이용약관과 개인정보 처리방침에 동의한 것으로 간주합니다. 수집된 정보는 회원 관리 목적으로만 사용됩니다.</p>
    </div>
  </div>
</body>
</html>
